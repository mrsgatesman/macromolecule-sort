<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Macromolecule Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: header bar with timer + controls, 2x2 grid of drop bins, shuffled card tray below. */
:root{
  --bg:#eef2f0; --panel:#ffffff; --ink:#1d2a2b; --muted:#5b6b6c; --line:#c9d5d2;
  --accent:#0f7c6e; --accent-ink:#ffffff; --hover:#e1ece9;
  --carb:#c9842b; --lipid:#b8a21c; --prot:#b4475a; --nuc:#3f6cb8;
  --good:#1d8a4a; --good-bg:#e3f4ea; --bad:#c23b2e; --bad-bg:#fbe7e4;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b1c; --panel:#1e2829; --ink:#e6eeec; --muted:#9fb0ae; --line:#34423f;
  --accent:#3cc1ad; --accent-ink:#0d1b19; --hover:#26332f;
  --carb:#e2a453; --lipid:#d6c04a; --prot:#e07b8d; --nuc:#7fa4e8;
  --good:#5bd08b; --good-bg:#16352a; --bad:#f07a6e; --bad-bg:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b1c; --panel:#1e2829; --ink:#e6eeec; --muted:#9fb0ae; --line:#34423f;
  --accent:#3cc1ad; --accent-ink:#0d1b19; --hover:#26332f;
  --carb:#e2a453; --lipid:#d6c04a; --prot:#e07b8d; --nuc:#7fa4e8;
  --good:#5bd08b; --good-bg:#16352a; --bad:#f07a6e; --bad-bg:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4vw,2.3rem);margin:0;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--muted);max-width:62ch}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.clock{font-family:var(--display);font-weight:600;font-size:1.5rem;font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right;padding-right:6px}
.best{color:var(--muted);font-size:.85rem}
button{font:inherit;cursor:pointer}
.btn{border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:700}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.card:focus-visible,.bin:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.result{border-radius:10px;padding:12px 16px;font-weight:700;background:var(--panel);border:1.5px solid var(--line)}
.result.win{background:var(--good-bg);border-color:var(--good);color:var(--ink)}
.bins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:720px){.bins{grid-template-columns:1fr}}
.bin{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:8px;min-width:0}
.bin.over{border-color:var(--accent);background:var(--hover)}
.bin.armed{border-style:solid;border-color:var(--accent)}
.bin h2{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0;display:flex;align-items:center;gap:8px}
.bin h2 .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.bin h2 .count{margin-left:auto;font-family:var(--body);font-size:.8rem;font-weight:400;color:var(--muted)}
.slot{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;flex:1}
.trayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.trayhead h2{font-family:var(--display);font-size:1.1rem;margin:0}
.trayhead span{color:var(--muted);font-size:.9rem}
.tray{display:flex;flex-wrap:wrap;gap:10px;padding:12px;border-radius:12px;background:var(--hover);min-height:80px}
.tray.over{outline:2px dashed var(--accent)}
.card{position:relative;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;max-width:300px;min-width:0;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgb(0 0 0 / .08);font-size:.92rem}
.card:hover{border-color:var(--accent)}
.card b{font-weight:700}
.card.img{padding:6px;background:#fff;border-color:var(--line)}
.card.img img{display:block;max-height:120px;width:auto;max-width:100%;pointer-events:none}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.card.right{border-color:var(--good);border-width:2.5px}
.card.wrong{border-color:var(--bad);border-width:2.5px;background:var(--bad-bg)}
.card.img.wrong{background:#fff}
.card .mark{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
.card.right .mark{background:var(--good)} .card.wrong .mark{background:var(--bad)}
.ghost{position:fixed;pointer-events:none;z-index:50;opacity:.92;transform:rotate(-2deg);box-shadow:0 8px 20px rgb(0 0 0 / .25)}
.card.lifted{opacity:.3}
.empty{color:var(--muted);font-style:italic}
.board{display:flex;flex-direction:column;gap:16px}
.traywrap{display:flex;flex-direction:column;gap:8px;min-width:0}
/* Wide screens: card pile on the left in its own scroll area, boxes on the right, so nothing has to travel off-screen */
@media (min-width:960px){
  .wrap{max-width:1400px}
  .board{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start}
  .traywrap{order:-1;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px)}
  .tray{overflow-y:auto;flex:1;min-height:200px;align-content:flex-start}
  .tray .card{max-width:100%}
}
html.dragging, html.dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s,box-shadow .15s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Macromolecule Sort</h1>
      <p class="sub">Drag each card into the macromolecule it describes. On a tablet you can also tap a card, then tap a box. Press <b>Check</b> when you're done.</p>
    </div>
    <div class="controls">
      <span class="best" id="best"></span>
      <span class="clock" id="clock" aria-live="off">0:00</span>
      <button class="btn primary" id="check">Check</button>
      <button class="btn" id="fix" hidden>Retry wrong cards</button>
      <button class="btn" id="reset">Start over</button>
    </div>
  </header>
  <div class="result" id="result" role="status" hidden></div>

  <div class="board">
    <section class="bins" id="bins"></section>
    <section class="traywrap">
      <div class="trayhead"><h2>Cards to sort</h2><span id="left"></span></div>
      <div class="tray" id="tray" data-bin="tray"></div>
    </section>
  </div>
</div>

  ["nuc","<b>structure:</b> 5-C sugar, nitrogenous base, phosphate group(s)"],
  ["nuc","<b>function:</b> store and transmit genetic information (ex: DNA, RNA)"],
  ["nuc",{img:"nuc_atp"}],["nuc",{img:"nuc_nt"}]
];

const $ = s => document.querySelector(s);
const tray = $("#tray"), binsEl = $("#bins");
let start = null, elapsed = 0, tick = null, checked = false, selected = null;

// build bins
BINS.forEach(b=>{
  const el = document.createElement("div");
  el.className="bin"; el.dataset.bin=b.id; el.style.setProperty("--c",b.c);
  el.tabIndex=0; el.setAttribute("role","button"); el.setAttribute("aria-label","Place selected card in "+b.name);
  el.innerHTML=`<h2><span class="dot"></span>${b.name}<span class="count"></span></h2><div class="slot"></div>`;
  el.addEventListener("click",e=>{ if(selected && !e.target.closest(".card")) place(selected, el); });
  el.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ") && selected && e.target===el){e.preventDefault(); place(selected, el);} });
  binsEl.appendChild(el);
});
tray.addEventListener("click",e=>{ if(selected && !e.target.closest(".card")) place(selected, tray); });

function makeCards(){
  const cards = ITEMS.map(([ans,content],i)=>{
    const c=document.createElement("button");
    c.type="button"; c.className="card"; c.dataset.ans=ans; c.id="card"+i;
    if(typeof content==="string"){ c.innerHTML=content; }
    else { c.classList.add("img"); c.innerHTML=`<img src="${IMG[content.img]}" alt="Structure diagram ${i+1}">`; c.setAttribute("aria-label","Structure diagram"); }
    attach(c); return c;
  });
  for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
  tray.innerHTML=""; binsEl.querySelectorAll(".slot").forEach(s=>s.innerHTML="");
  cards.forEach(c=>tray.appendChild(c));
}

function slotOf(target){ return target===tray ? tray : target.querySelector(".slot"); }
function place(card, target){
  clearMarks(card);
  slotOf(target).appendChild(card);
  select(null);
  startClock();
  update();
}
function select(card){
  if(selected) selected.classList.remove("sel");
  selected = card;
  binsEl.querySelectorAll(".bin").forEach(b=>b.classList.toggle("armed",!!card));
  if(card) card.classList.add("sel");
}
function clearMarks(card){ card.classList.remove("right","wrong"); card.querySelector(".mark")?.remove(); }

// Drag controller: one drag at a time, tracked at the document level so it
// always finishes (even if the pointer leaves the card, the window loses focus,
// or the browser cancels), and the page auto-scrolls near the top/bottom edge.
let drag=null, suppressClick=null;
function attach(card){
  card.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse" && e.button!==0) return;
    if(drag) endDrag(false);
    if(e.pointerType==="mouse") e.preventDefault(); // stop text selection / native drag
    drag={card,id:e.pointerId,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,active:false,ghost:null,over:null,raf:0};
  });
  card.addEventListener("click",e=>{
    e.stopPropagation();
    if(suppressClick===card){ suppressClick=null; return; }
    select(selected===card?null:card);
  });
  card.addEventListener("dragstart",e=>e.preventDefault());
}
function beginDrag(){
  const d=drag, r=d.card.getBoundingClientRect();
  d.active=true; select(null);
  d.ox=d.sx-r.left; d.oy=d.sy-r.top;
  const g=d.card.cloneNode(true); g.classList.remove("sel"); g.classList.add("ghost"); g.removeAttribute("id");
  g.style.width=r.width+"px"; g.setAttribute("aria-hidden","true"); g.tabIndex=-1;
  document.body.appendChild(g); d.ghost=g;
  d.card.classList.add("lifted"); document.documentElement.classList.add("dragging");
  d.raf=requestAnimationFrame(autoScroll);
}
function moveGhost(){
  const d=drag; if(!d||!d.active) return;
  d.ghost.style.left=(d.x-d.ox)+"px"; d.ghost.style.top=(d.y-d.oy)+"px";
  const t=dropTarget(d.x,d.y);
  if(t!==d.over){ d.over?.classList.remove("over"); d.over=t; t?.classList.add("over"); }
}
function autoScroll(){
  const d=drag; if(!d||!d.active) return;
  const edge=70, h=innerHeight; let dy=0;
  if(d.y<edge) dy=-Math.ceil((edge-d.y)/4);
  else if(d.y>h-edge) dy=Math.ceil((d.y-(h-edge))/4);
  if(dy){ window.scrollBy(0,dy); moveGhost(); }
  // also scroll the card pile if it has its own scroll area
  const tr=tray.getBoundingClientRect();
  if(tray.scrollHeight>tray.clientHeight && d.x>=tr.left && d.x<=tr.right){
    if(d.y<tr.top+40 && d.y>tr.top-10) tray.scrollTop-=8;
    else if(d.y>tr.bottom-40 && d.y<tr.bottom+10) tray.scrollTop+=8;
  }
  d.raf=requestAnimationFrame(autoScroll);
}
function endDrag(drop){
  const d=drag; if(!d) return;
  drag=null;
  cancelAnimationFrame(d.raf);
  document.documentElement.classList.remove("dragging");
  if(!d.active) return;
  d.ghost.remove(); d.card.classList.remove("lifted"); d.over?.classList.remove("over");
  suppressClick=d.card; setTimeout(()=>{ if(suppressClick===d.card) suppressClick=null; },400);
  if(drop && d.over) place(d.card,d.over);
}
document.addEventListener("pointermove",e=>{
  const d=drag; if(!d||e.pointerId!==d.id) return;
  d.x=e.clientX; d.y=e.clientY;
  // safety net: the mouse button was released somewhere we didn't hear about
  if(e.pointerType==="mouse" && e.buttons===0){ if(d.active) moveGhost(); endDrag(true); return; }
  if(!d.active){ if(Math.hypot(d.x-d.sx,d.y-d.sy)>6) beginDrag(); else return; }
  e.preventDefault(); moveGhost();
},{passive:false});
document.addEventListener("pointerup",e=>{ if(drag&&e.pointerId===drag.id){ drag.x=e.clientX; drag.y=e.clientY; if(drag.active) moveGhost(); endDrag(true);} });
document.addEventListener("pointercancel",e=>{ if(drag&&e.pointerId===drag.id) endDrag(false); });
window.addEventListener("blur",()=>endDrag(false));
document.addEventListener("visibilitychange",()=>{ if(document.hidden) endDrag(false); });
function dropTarget(x,y){
  const el=document.elementFromPoint(x,y);
  if(!el) return null;
  return el.closest(".bin") || el.closest(".tray");
}

// timer
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function startClock(){ if(tick) return; start=Date.now()-elapsed; tick=setInterval(()=>{elapsed=Date.now()-start;$("#clock").textContent=fmt(elapsed);},250); }
function stopClock(){ if(tick){clearInterval(tick);tick=null;elapsed=Date.now()-start;$("#clock").textContent=fmt(elapsed);} }

function update(){
  const n=tray.children.length;
  $("#left").textContent = n ? n+" left" : "All cards placed";
  if(!n) tray.innerHTML='<span class="empty">Empty. Press Check to see how you did.</span>';
  else tray.querySelector(".empty")?.remove();
  binsEl.querySelectorAll(".bin").forEach(b=>{const k=b.querySelector(".slot").children.length;b.querySelector(".count").textContent=k?k+" card"+(k>1?"s":""):"";});
}

// best time (this device only)
function getBest(){ try{return +localStorage.getItem("macroBest")||0}catch(e){return 0} }
function setBest(ms){ try{localStorage.setItem("macroBest",ms)}catch(e){} }
function showBest(){ const b=getBest(); $("#best").textContent=b?"Best: "+fmt(b):""; }

$("#check").addEventListener("click",()=>{
  select(null);
  const all=[...document.querySelectorAll(".bins .card, .tray .card")];
  let right=0, wrong=0;
  all.forEach(c=>{
    clearMarks(c);
    const bin=c.closest(".bin");
    if(!bin) return;
    const ok=bin.dataset.bin===c.dataset.ans;
    c.classList.add(ok?"right":"wrong");
    const m=document.createElement("span"); m.className="mark"; m.textContent=ok?"✓":"✗"; m.setAttribute("aria-hidden","true");
    c.appendChild(m); c.setAttribute("aria-description",ok?"correct":"incorrect");
    ok?right++:wrong++;
  });
  const left=tray.querySelectorAll(".card").length, total=ITEMS.length;
  const r=$("#result"); r.hidden=false; r.classList.remove("win");
  if(right===total){
    stopClock(); r.classList.add("win");
    const b=getBest(); let msg=`All ${total} correct in ${fmt(elapsed)}!`;
    if(!b||elapsed<b){ setBest(elapsed); msg+= b?" New best time.":""; }
    r.textContent=msg; showBest(); $("#fix").hidden=true; confetti();
  } else {
    r.textContent=`${right} of ${total} correct` + (wrong?` · ${wrong} in the wrong box`:"") + (left?` · ${left} not placed yet`:"") + ". The clock is still running.";
    $("#fix").hidden=!wrong;
  }
});
$("#fix").addEventListener("click",()=>{
  document.querySelectorAll(".card.wrong").forEach(c=>{clearMarks(c);tray.appendChild(c);});
  $("#fix").hidden=true; update();
});
$("#reset").addEventListener("click",()=>{
  endDrag(false);
  stopClock(); elapsed=0; start=null; $("#clock").textContent="0:00";
  $("#result").hidden=true; $("#fix").hidden=true; select(null);
  makeCards(); update();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") select(null); });

// confetti rain on a perfect score
function confetti(){
  document.getElementById("confetti")?.remove();
  const cv=document.createElement("canvas"); cv.id="confetti";
  cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60";
  document.body.appendChild(cv);
  const ctx=cv.getContext("2d"), dpr=window.devicePixelRatio||1;
  const W=innerWidth, H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);
  const colors=["#c9842b","#d6c04a","#b4475a","#3f6cb8","#0f7c6e","#e07b8d","#7fa4e8","#5bd08b"];
  const N=Math.min(260,Math.round(W/4)), DUR=4500, t0=performance.now();
  const ps=Array.from({length:N},()=>({x:Math.random()*W,y:-20-Math.random()*H*0.9,w:6+Math.random()*6,h:8+Math.random()*8,
    vy:2+Math.random()*3,vx:-1+Math.random()*2,rot:Math.random()*6.28,vr:-.15+Math.random()*.3,sway:Math.random()*6.28,
    c:colors[Math.floor(Math.random()*colors.length)]}));
  function frame(now){
    const t=now-t0; ctx.clearRect(0,0,W,H);
    const fade=t>DUR-800?Math.max(0,(DUR-t)/800):1; ctx.globalAlpha=fade;
    ps.forEach(p=>{p.sway+=.05;p.x+=p.vx+Math.sin(p.sway)*.8;p.y+=p.vy;p.rot+=p.vr;
      if(p.y<H+20){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
        ctx.fillRect(-p.w/2,-p.h/2*Math.abs(Math.cos(p.rot)),p.w,p.h*Math.abs(Math.cos(p.rot))+1);ctx.restore();}});
    if(t<DUR) requestAnimationFrame(frame); else cv.remove();
  }
  requestAnimationFrame(frame);
}

makeCards(); update(); showBest();
</script>

</body></html>
